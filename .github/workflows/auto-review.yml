name: Auto review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read
  actions: read
  checks: read
  statuses: read
  pull-requests: write

concurrency:
  group: auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR') &&
      github.event.pull_request.user.type != 'Bot' &&
      !endsWith(github.event.pull_request.user.login, '[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install OpenCode CLI
        run: npm install --global @opencode/cli@2.3.2

      - name: Prepare review
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          prompt=$(cat <<'PROMPT'
          Ты — независимый ревьюер пулл-реквеста. Подготовь текст комментария строго по REVIEW.md, который приложен
          к сообщению файлом. Сначала прочитай AGENTS.md, docs/agents/issue-tracker.md, docs/agents/skills.md,
          docs/agents/triage-labels.md, docs/agents/domain.md, GLOSSARY.md, релевантные ADR в docs/adr/ и REVIEW.md.

          Сверь PR со спецификацией в .scratch/booking-spec/, с тикетами в GitHub Issues и с согласованием в теле PR.
          Все команды gh выполняй с --repo maximusw124/ai-for-developers-project-387. Номер PR доступен в переменной
          окружения PR_NUMBER, базовый коммит — BASE_SHA, коммит PR — HEAD_SHA, репозиторий — GITHUB_REPOSITORY.
          Изучи diff командой git diff "$BASE_SHA" "$HEAD_SHA" и через gh pr diff "$PR_NUMBER", прочитай тело PR и
          связанные issue/тикеты через gh pr view/gh issue view. Результаты CI читай через GitHub API для HEAD_SHA:
          check-runs, statuses и список запусков workflows (для этого достаточно прав на чтение). Если проверки ещё
          идут, не считай это подтверждённым дефектом; если проверка красная, используй её как доказательство только
          вместе с причиной из логов/теста.

          Сообщай только о подтверждённых дефектах по критериям REVIEW.md. Для каждого замечания укажи путь к файлу,
          номер строки, условие ошибки и последствие. Если подтверждённых дефектов нет, выведи ровно одну строку:
          Подтверждённых дефектов по REVIEW.md не найдено.
          Первой строкой выведи: > *This was generated by AI during automated review.*

          Запрещено: изменять какие-либо файлы, коммитить, пушить, создавать ветки и PR, оставлять комментарии,
          менять метки, статусы и проверки, писать в репозиторий. Не дублируй вывод линтера, тестов и CI, не добавляй
          неподтверждённые риски, вопросы и предложенные правки. В stdout выведи только готовый текст комментария —
          без пояснений и без обёртки в markdown-блок.
          PROMPT
          )
          opencode run --standalone --model opencode/big-pickle --file REVIEW.md "$prompt" > "$RUNNER_TEMP/pr-review.md"

      - name: Verify checkout is untouched
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi

      - name: Export review body
        id: review
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/pr-review.md"
          {
            echo 'body<<OPENCODE_AUTO_REVIEW_EOF'
            cat "$RUNNER_TEMP/pr-review.md"
            echo 'OPENCODE_AUTO_REVIEW_EOF'
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: review
    if: needs.review.outputs.body != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Publish review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_BODY: ${{ needs.review.outputs.body }}
        run: |
          set -euo pipefail
          printf '%s\n' "$REVIEW_BODY" | gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -

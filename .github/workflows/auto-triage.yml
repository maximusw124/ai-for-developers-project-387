name: auto-triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: auto-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR') &&
      github.event.issue.user.type != 'Bot' &&
      !endsWith(github.event.issue.user.login, '[bot]') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent') &&
      !contains(github.event.issue.labels.*.name, 'needs-triage') &&
      !contains(github.event.issue.labels.*.name, 'needs-info') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-human') &&
      !contains(github.event.issue.labels.*.name, 'wontfix') &&
      !contains(join(github.event.issue.labels.*.name, ','), 'wayfinder:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode triage
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: "opencode/big-pickle"
          share: false
          prompt: |
            Выполни предварительный триаж только что открытого Issue в репозитории maximusw124/ai-for-developers-project-387.

            Обязательно вызови Skill tool со скиллом "triage" и следуй ему. Перед этим прочитай AGENTS.md, docs/agents/issue-tracker.md, docs/agents/skills.md, docs/agents/triage-labels.md, docs/agents/domain.md, GLOSSARY.md и релевантные ADR в docs/adr/. Изучи код репозитория и само обращение: тело, автора, метки, комментарии; проверь, нет ли уже реализованного поведения и нет ли похожего отказа в .out-of-scope/. Все команды gh выполняй с --repo maximusw124/ai-for-developers-project-387.

            Сделай предварительный разбор: предложи категорию (bug или enhancement) и состояние (needs-triage или needs-info), объясни вывод кратко и по делу. Если данных не хватает, задай конкретные уточняющие вопросы в комментарии к Issue по шаблону "Triage Notes" из скилла. Каждый комментарий в трекере начинай с строки:
            > *This was generated by AI during triage.*

            Обнови метки трекера через gh: оставь ровно одну категорию и одно состояние из docs/agents/triage-labels.md, убирая конфликтующие. Если нужная метка отсутствует, создай её перед применением. Не переходи сам в ready-for-agent, ready-for-human или wontfix и не закрывай Issue: эти решения остаются за человеком.

            НЕ изменяй код репозитория: не редактируй и не создавай файлы, не коммить, не пушить, не создавай ветки и PR. Разрешены только чтение репозитория, комментарии к Issue и работа с метками трекера.

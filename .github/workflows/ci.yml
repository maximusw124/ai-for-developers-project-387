name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run install
      - run: mise run check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run install
      - run: npx playwright install --with-deps chromium
      - run: mise run e2e
      - name: Write E2E artifact metadata
        if: always()
        run: |
          {
            echo "### Playwright E2E artifacts"
            echo "Head SHA: \`${{ github.event.pull_request.head.sha || github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/
          retention-days: 7
